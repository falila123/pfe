name: CI/CD - Build & Push image Docker

# Déclenché à chaque push sur main (+ lancement manuel possible)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ex. falila123/pfe

jobs:
  # ===================== 1) Tests automatisés (CI) =====================
  test:
    name: Tests automatisés
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, zip, gd, fileinfo
          coverage: none

      - name: Préparation de l'environnement (.env)
        run: cp .env.example .env

      - name: Installation des dépendances PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Génération de la clé d'application
        run: php artisan key:generate

      - name: Exécution des tests (Pest)
        run: php artisan test

  # ============ 2) Build & publication de l'image (CD) ============
  # Ne s'exécute que si les tests passent.
  build-and-push:
    name: Build & Push image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read      # lire le code
      packages: write     # pousser l'image vers GHCR

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
